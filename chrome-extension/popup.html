<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StartupHub Instant Capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      width: 440px;
      height: 480px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Container */
    .container {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(to right, #ffffff, #d1d5db);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    /* Form Container */
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    input, textarea {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 10px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background-color: rgba(17, 24, 39, 0.8);
    }

    textarea {
      resize: none;
      height: 120px;
      line-height: 1.5;
    }

    .shortcut-tip {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    kbd {
      background: var(--border-color);
      border: 1px solid #374151;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 9px;
      font-family: monospace;
      color: var(--text-primary);
    }

    /* Footer Buttons */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background-color: rgba(31, 41, 55, 0.4);
      color: var(--text-primary);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Success / Loading states */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-color);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: fadeIn 0.3s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--success);
      font-size: 32px;
      animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes scaleUp {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .state-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .state-desc {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon"></div>
        <h1>StartupHub</h1>
      </div>
      <span class="badge">OS Capture</span>
    </header>

    <form id="ideaForm">
      <div class="form-group">
        <label for="title">Idea Title</label>
        <input type="text" id="title" placeholder="e.g. Automated PDF generation for onboarding" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="description">Details & Context</label>
        <textarea id="description" placeholder="Describe your thoughts, who is involved, or what problem this solves..." required></textarea>
      </div>

      <div class="shortcut-tip">
        <span>Global Shortcut:</span>
        <kbd id="shortcutKeys">Ctrl+Shift+Y</kbd>
      </div>

      <div class="actions">
        <button type="button" class="btn-secondary" id="closeBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="submitBtn">
          <span>Capture Idea</span>
        </button>
      </div>
    </form>

    <!-- Success Overlay -->
    <div class="overlay" id="successOverlay">
      <div class="success-icon">✓</div>
      <div class="state-title">Idea Captured!</div>
      <div class="state-desc" id="successDesc">"Onboarding PDFs" has been linked and sent to your workspace inbox.</div>
      <button class="btn-primary" id="doneBtn" style="flex: none; width: 140px;">Done</button>
    </div>

    <!-- Loading Overlay -->
    <div class="overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="state-title">Processing...</div>
      <div class="state-desc">Running semantic duplicate checks and saving to inbox...</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
