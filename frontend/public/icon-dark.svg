<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>
  <!-- Connections/Links -->
  <path d="M 70 25 C 50 20, 30 25, 30 40 C 30 55, 70 45, 70 60 C 70 75, 50 80, 30 75" 
        fill="none" stroke="url(#netGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Nodes -->
  <circle cx="70" cy="25" r="7" fill="#F43F5E" />
  <circle cx="30" cy="40" r="5" fill="#3B82F6" />
  <circle cx="50" cy="50" r="6" fill="#8B5CF6" />
  <circle cx="70" cy="60" r="5" fill="#EC4899" />
  <circle cx="30" cy="75" r="7" fill="#10B981" />
  <!-- Subtle network lines -->
  <line x1="70" y1="25" x2="50" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="30" y1="75" x2="50" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
</svg>
