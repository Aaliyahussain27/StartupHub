  <line x1="70" y1="25" x2="50" y2="50" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="30" y1="75" x2="50" y2="50" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
