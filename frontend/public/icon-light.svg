  <circle cx="30" cy="40" r="5" fill="#2563EB" />
  <circle cx="50" cy="50" r="6" fill="#7C3AED" />
  <circle cx="70" cy="60" r="5" fill="#DB2777" />
  <circle cx="30" cy="75" r="7" fill="#059669" />
