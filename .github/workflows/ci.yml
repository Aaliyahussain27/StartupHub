name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # BACKEND: TypeScript compile + unit tests
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: |
          if [ -f "jest.config.js" ] || [ -f "jest.config.ts" ]; then
            npx jest --passWithNoTests
          else
            echo "No test runner configured — skipping (add jest later)"
          fi
        env:
          NODE_ENV: test
          DATABASE_URL: ""          # No real DB needed for unit tests
          CLAUDE_API_KEY: ""

  # ─────────────────────────────────────────────────────────────────────────
  # FRONTEND: TypeScript check + Vite production build
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript + Vite production build
        run: npm run build
        env:
          VITE_BACKEND_URL: http://localhost:3001

      - name: ESLint
        run: npm run lint --if-present
        continue-on-error: true   # warnings are OK, don't fail the pipeline

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # DB MIGRATION DRY-RUN (only on pushes with schema changes)
  # ─────────────────────────────────────────────────────────────────────────
  db-migrate-check:
    name: DB — Migration syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check migrate script compiles
        run: npx tsc --noEmit scripts/migrate.ts 2>/dev/null || echo "migrate.ts not yet added — OK"
